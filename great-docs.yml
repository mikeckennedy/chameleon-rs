# Great Docs configuration for chameleon-rs (docs/docs-site-plan.md).
# See https://posit-dev.github.io/great-docs/user-guide/configuration.html
#
# Build with `make docs` (needs the extension built: `make build`), preview with
# `make docs-serve`. The site is mirrored into site/ (committed), not docs/, which holds the
# design documents.

display_name: chameleon-rs

# The originals in assets/ are opaque; the -light/-dark navbar copies have the background
# removed (and, for dark mode, the black body parts lightened).
logo:
  light: assets/chameleon-rs-logo-light.png
  dark: assets/chameleon-rs-logo-dark.png
  alt: chameleon-rs
  show_title: true
favicon: assets/chameleon-rs-logo-light.png

hero:
  enabled: true
  logo: assets/chameleon-rs-slogan.png
  logo_height: 220px

social_cards:
  # Absolute: with a relative path, great-docs 0.13.0 points og:image at the site root, where
  # the image is never published (404).
  image: https://mkennedy.codes/docs/chameleon-rs/assets/chameleon-rs-slogan.png

# The distribution is chameleon-rs; the import name can't be inferred from it.
module: chameleon_rs

# Docstrings are prose today; the docstring pass (plan §6 step 2) moves them to Google style.
parser: google

# Static analysis. Runtime introspection reports a cyclic alias for `render_partial` (an
# instance of PartialRenderer, whose class is named `function` to match chameleon_partials'
# error messages) and falls back to static anyway. `core_version` is read from _native.pyi.
dynamic: false

# Subpath hosting: drives Quarto's base path so CSS/JS/nav resolve under the subdirectory.
# Keep the trailing slash.
site_url: "https://mkennedy.codes/docs/chameleon-rs/"

# The sitemap / robots / canonical base is auto-detected from the GitHub repo and does not
# fall back to site_url. Pin it to the real hosting domain.
seo:
  canonical:
    base_url: "https://mkennedy.codes/docs/chameleon-rs/"

repo: https://github.com/mikeckennedy/chameleon-rs
github_style: widget
source:
  enabled: true
  branch: main
  # The package lives in python/, not at the repo root.
  path: python/chameleon_rs
  placement: usage

pypi: true

# Great Docs defaults this to true, which renders an empty "MCP" tab.
mcp:
  enabled: false

# The design notes and build artifacts are not site content.
exclude:
  - _native

user_guide:
  - section: "Get started"
    contents:
      - getting-started.qmd
      - switching-from-chameleon.qmd
  - section: "Templates"
    contents:
      - template-language.qmd
      - partials.qmd
      - htmx.qmd
      - markdown.qmd
      - async.qmd
      - strict-tags.qmd
      - configuration.qmd
  - section: "Web frameworks"
    contents:
      - frameworks.qmd
      - flask.qmd
      - fastapi.qmd
      - starlette.qmd
      - robyn.qmd
      - litestar.qmd
      - pyramid.qmd
  - section: "Background"
    contents:
      - compatibility.qmd
      - security.qmd
      - performance.qmd
      - migrating.qmd

sections:
  - title: Language Reference
    dir: language
    navbar_after: User Guide
  - title: Recipes
    dir: recipes
    index: true
    navbar_after: Language Reference

skill:
  extra_body: skill_extra_body.md
  gotchas:
    - "chameleon_rs.compat.install() must run before anything imports chameleon, chameleon_partials, chameleon_flask, fastapi_chameleon or chameleon_robyn; a module already imported keeps stock Chameleon's objects."
    - "render_partial looks in the configured template folder, then on the calling template's search path and in its folder and each folder above it. chameleon_rs.configure(partial_search='registered') restores chameleon_partials' lookup (configured folder only)."
    - "render_partial is a builtin in every template; you don't need extend_model() or a BeforeRender subscriber (both still work)."
    - "configure() applies on every call (there is no cache_init); the first call must give template_folder."
    - "template.source does not exist as Python code: with keep_source=True it is a dump of the compiled program."
    - "Custom expression types that return Python AST work through a bridge at fallback speed; types that depend on Chameleon's compiler internals are not supported."
    - "render_async awaits only an expression's final value: ${episodes} and tal:repeat=\"e episodes\" await a coroutine, ${episodes.count} and ${len(episodes)} do not."
    - "markdown: expressions exist only after chameleon_rs.configure(markdown=True) (or a dict of profiles), called before the templates that use them compile."
    - "Pyramid has no chameleon_rs module: pyramid_chameleon runs unchanged after chameleon_rs.compat.install() at the top of the package whose main() builds the app."
  best_practices:
    - "Call chameleon_rs.configure(template_folder=..., auto_reload=dev_mode) once at startup, before the first render."
    - "To switch an existing app, add `import chameleon_rs.compat; chameleon_rs.compat.install()` as the first lines of the entry point, and leave the rest of the code unchanged."
    - "Prefer ${render_partial('shared/card.pt', item=item)} as a whole expression: it renders as a native frame of the page, with no Python call."
    - "Build template folder paths with (Path(__file__).parent / 'templates').as_posix()."
    - "In tests, reset with chameleon_rs.partials.clear() (or chameleon_rs.flask.clear(), chameleon_rs.fastapi.clear(), chameleon_rs.starlette.clear(), chameleon_rs.robyn.clear(), chameleon_rs.litestar.clear()) between configurations."
    - "Put @template below the route decorator (@app.get, @router.get, @app.route, Litestar's @get); pass app= to configure() so a misordered view fails at startup with DecoratorOrderError."
    - "With Litestar, return chameleon_rs.litestar.Template (not litestar.response.Template) for .pt templates: Litestar guesses the media type from the suffix and serves .pt as text/plain."
  decision_table:
    - need: "Run an existing Chameleon app on chameleon-rs with no code changes"
      use: "chameleon_rs.compat.install() at the top of the entry point"
    - need: "Render a template string"
      use: "chameleon_rs.PageTemplate(source)(**model)"
    - need: "Load templates by name from folders"
      use: "chameleon_rs.PageTemplateLoader([folder])['page.pt'](**model)"
    - need: "Insert a reusable HTML fragment"
      use: "${render_partial('shared/fragment.pt', key=value)}"
    - need: "Get a rendered fragment as a string from Python (HTMX, email, tests)"
      use: "chameleon_rs.render_partial(path, **model).html_text"
    - need: "Serve HTMX: a full page on first load, one fragment on an HTMX request"
      use: "Put the fragment in its own template, include it with ${render_partial(...)}; the view returns response('fragment.pt', ...) when the HX-Request header is set (and HX-History-Restore-Request is not), or @template('fragment.pt') on an HTMX-only route"
    - need: "Render Chameleon templates from Flask or Quart views"
      use: "chameleon_rs.flask: configure(folder), then @template('page.pt') on the view"
    - need: "Render Chameleon templates from FastAPI views"
      use: "chameleon_rs.fastapi: configure(folder, app=app), then @template('page.pt') below @app.get"
    - need: "Replace Starlette's Jinja2Templates"
      use: "chameleon_rs.starlette.Templates(directory=folder); await templates.TemplateResponse_async(request, 'page.pt', context) in async endpoints"
    - need: "Render Chameleon templates from Robyn handlers"
      use: "chameleon_rs.robyn: configure(folder, app=app), then @template('page.pt') below @app.get (Robyn has wheels for Python 3.10-3.14)"
    - need: "Render without blocking the event loop"
      use: "await template.render_async(**model); in the framework integrations, an async def view with @template does this"
    - need: "Run several slow async helpers of one page at the same time"
      use: "@chameleon_rs.concurrent on the helper, called as a whole ${helper(...)}; or PageTemplate(..., concurrent=True) / @template(..., concurrent=True) for partials with awaitable arguments"
    - need: "Convert Markdown to HTML in a template"
      use: "chameleon_rs.configure(markdown=True), then ${markdown: post.body}; profiles such as {'md-trusted': {'raw_html': 'allow'}} for different content"
    - need: "Render Chameleon templates from Pyramid views"
      use: "pyramid_chameleon unchanged (config.include('pyramid_chameleon'), renderer='templates/page.pt'), with chameleon_rs.compat.install() before it is imported"
    - need: "Use Chameleon templates as Litestar's template engine"
      use: "TemplateConfig(engine=chameleon_rs.litestar.ChameleonEngine, directory=folder); return chameleon_rs.litestar.Template('page.pt', context=...) (served as text/html; renders synchronously)"
    - need: "Render Chameleon templates from async Litestar handlers without blocking the loop"
      use: "chameleon_rs.litestar: configure(folder, app=app), then @template('page.pt') below @get"

# Umami analytics, merged into Quarto's format.html.include-in-header so it lands in the
# <head> of every page. Same website id as the partials docs: both live under
# mkennedy.codes/docs/.
include_in_header:
  - text: |
      <script async src="https://uma.mkennedy.codes/script.js" data-website-id="fc9b6770-3b44-4073-944e-4a4f0e79f66a"></script>

jupyter: python3

authors:
  - name: Michael Kennedy
    role: Author
    email: michael@mkennedy.tech
    github: mikeckennedy
    homepage: https://mkennedy.codes

reference:
  title: "API Reference"
  desc: >-
    The public API of chameleon-rs. It mirrors Chameleon's (PageTemplate,
    PageTemplateFile, PageTemplateLoader, ...), plus async rendering, built-in partials,
    process-wide configuration (including Markdown) and the Flask/Quart, FastAPI, Starlette,
    Robyn and Litestar integrations.
  sections:
    - title: Templates
      desc: "Compile and render templates from strings, files and folders."
      contents:
        - PageTemplate
        - PageTemplateFile
        - PageTextTemplate
        - PageTextTemplateFile
        - PageTemplateLoader
    - title: Configuration
      desc: "Process-wide settings for templates loaded by name, partials and Markdown."
      contents:
        - configure
        - core_version
    - title: Async
      desc: "Opt-in concurrency for render_async. See also PageTemplate.render_async."
      contents:
        - concurrent
    - title: Partials
      desc: "Render one template inside another. Also chameleon_partials' API."
      contents:
        - render_partial
        - partials.register_extensions
        - partials.extend_model
        - partials.clear
        - partials.PartialRenderer
        - partials.HTML
        - partials.PartialsException
    - title: Flask and Quart
      desc: "chameleon-flask's API, built in. Imports Flask only when imported itself."
      contents:
        - flask.configure
        - flask.global_init
        - flask.template
        - flask.render
        - flask.response
        - flask.not_found
        - flask.error
        - flask.clear
        - flask.check_views
    - title: FastAPI
      desc: "fastapi-chameleon's API, built in. Imports FastAPI only when imported itself."
      contents:
        - fastapi.configure
        - fastapi.global_init
        - fastapi.template
        - fastapi.render
        - fastapi.render_async
        - fastapi.response
        - fastapi.response_async
        - fastapi.not_found
        - fastapi.error
        - fastapi.generic_error
        - fastapi.clear
        - fastapi.check_views
    - title: Starlette
      desc: "Jinja2Templates' API for chameleon-rs, and the decorator API. Imports Starlette only when imported itself."
      contents:
        - starlette.Templates
        - starlette.configure
        - starlette.global_init
        - starlette.template
        - starlette.render
        - starlette.render_async
        - starlette.response
        - starlette.response_async
        - starlette.not_found
        - starlette.error
        - starlette.generic_error
        - starlette.clear
        - starlette.check_views
    - title: Robyn
      desc: "chameleon-robyn's API, built in. Imports Robyn only when imported itself."
      contents:
        - robyn.configure
        - robyn.global_init
        - robyn.template
        - robyn.render
        - robyn.render_async
        - robyn.response
        - robyn.response_async
        - robyn.not_found
        - robyn.error
        - robyn.generic_error
        - robyn.clear
        - robyn.check_views
        - robyn.ChameleonTemplate
    - title: Litestar
      desc: "Litestar's template engine interface for chameleon-rs, and the decorator API. Imports Litestar only when imported itself."
      contents:
        - litestar.ChameleonEngine
        - litestar.ChameleonTemplate
        - litestar.Template
        - litestar.configure
        - litestar.global_init
        - litestar.template
        - litestar.render
        - litestar.render_async
        - litestar.response
        - litestar.response_async
        - litestar.not_found
        - litestar.error
        - litestar.generic_error
        - litestar.clear
        - litestar.check_views
    - title: Errors and web helpers
      desc: "Exceptions, and the pieces shared by the framework integrations."
      contents:
        # Its members are inherited exception plumbing (__copy__, __str__, ...).
        - name: TemplateError
          members: false
        - web.TemplateError
        - web.ErrorPage
        - web.NotFound
        - web.TemplateNotFound
        - web.DecoratorOrderError
        - web.model_of
    - title: Compatibility
      desc: "Make `import chameleon` resolve to chameleon-rs, or check both engines side by side."
      contents:
        - compat.install
        - shadow.install
        - shadow.uninstall
        - shadow.ShadowDifference
