[package]
name = "chameleon-core"
description = "Pure-Rust core of chameleon-rs: tokenizer, parser, program builder and renderer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
memchr.workspace = true
stacker.workspace = true
regex.workspace = true
comrak = { workspace = true, optional = true }

[features]
# The `markdown:` expression type: Markdown to HTML with comrak (on in the wheel).
markdown = ["dep:comrak"]

[dev-dependencies]
# The reference engine for the hand-written matchers and the tokenizer fast path (tests only).
fancy-regex.workspace = true
insta.workspace = true
proptest.workspace = true
criterion.workspace = true

# Micro-benchmarks of the escaping, the tokenizer and the VM loop (`cargo bench -p chameleon-core`).
[[bench]]
name = "core"
harness = false

[lints]
workspace = true
