# Builds the throwaway spike as its own module, so it never touches chameleon_rs.
# Run from this directory: ../../venv/bin/maturin develop --release
[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "chameleon-spike"
version = "0.0.0"
requires-python = ">=3.12"

[tool.maturin]
module-name = "chameleon_spike"
