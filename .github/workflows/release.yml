name: Release

# Builds the release artifacts, tests every wheel, and (only when asked) publishes to PyPI.
# Run it by hand: Actions > Release > Run workflow. With `publish` unchecked it is a dry run
# that builds and tests everything and keeps the artifacts on the run. The version is whatever
# Cargo.toml says: bump it (and CHANGELOG.md) before running with `publish`.
#
# Wheels: CPython 3.12-3.15 and free-threaded 3.14t/3.15t, for Linux (manylinux_2_28 and
# musllinux_1_2, x86_64 and aarch64), macOS (arm64, x86_64) and Windows (x64, arm64), plus the
# sdist. Every wheel is built by scripts/pgo_wheel.py, on a native runner of its architecture
# (Linux: inside the PyPA image, scripts/linux_wheel.sh), profile-guided where the matrix says
# `pgo: true`: the training runs on that runner, per interpreter. PGO verified locally: macOS
# arm64. Expected to work, not yet run: manylinux, macOS x86_64, Windows x64. Unverified:
# musllinux and Windows arm64. Every PGO entry passes `--fallback-plain`: where no profile can
# be made (no llvm-tools or profiler runtime, a training dependency without a wheel) the wheel
# is built plain, with a warning; each job's summary says which kind every wheel is. A profile
# that does not fit the code (stale, or made for other symbol names) still fails the build.
#
# Before the first run (the repository is private today):
# - The arm64 runners (ubuntu-24.04-arm, windows-11-arm) are free for public repositories
#   only; a private repository needs arm64 larger runners on a paid plan. Make the repository
#   public first, or drop those matrix entries.
# - macOS minutes count 10x against a private repository's quota (12 macOS build jobs and 12
#   macOS test jobs per run).
# - The PyPI page links (Source, Issues, Changelog) point at GitHub and 404 while the
#   repository is private: make it public before publishing. (The README image is hosted
#   outside GitHub.)
# - Create the `pypi` environment (Settings > Environments, with required reviewers) and the
#   trusted publisher on PyPI for this repository, `release.yml` and environment `pypi`.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to PyPI (trusted publishing, environment `pypi`) after every test passes"
        type: boolean
        default: false

permissions:
  contents: read

# One release run at a time: two runs must never race to publish.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PYTHONUTF8: "1"

jobs:
  linux:
    name: ${{ matrix.platform.name }} (${{ matrix.python }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: manylinux-x86_64, runner: ubuntu-24.04, image: "quay.io/pypa/manylinux_2_28_x86_64", target: x86_64-unknown-linux-gnu, compatibility: manylinux_2_28, pgo: true }
          - { name: manylinux-aarch64, runner: ubuntu-24.04-arm, image: "quay.io/pypa/manylinux_2_28_aarch64", target: aarch64-unknown-linux-gnu, compatibility: manylinux_2_28, pgo: true }
          - { name: musllinux-x86_64, runner: ubuntu-24.04, image: "quay.io/pypa/musllinux_1_2_x86_64", target: x86_64-unknown-linux-musl, compatibility: musllinux_1_2, pgo: true }
          - { name: musllinux-aarch64, runner: ubuntu-24.04-arm, image: "quay.io/pypa/musllinux_1_2_aarch64", target: aarch64-unknown-linux-musl, compatibility: musllinux_1_2, pgo: true }
        python: ["3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # The image runs natively on a runner of its architecture, with every CPython under
      # /opt/python, so the instrumented build can be trained there; the workspace is mounted
      # at the same path. Only the variables the script needs go in (no tokens).
      - name: Build in ${{ matrix.platform.image }}
        env:
          IMAGE: ${{ matrix.platform.image }}
          PYTHON_VERSION: ${{ matrix.python }}
          TARGET: ${{ matrix.platform.target }}
          COMPATIBILITY: ${{ matrix.platform.compatibility }}
          PGO: ${{ matrix.platform.pgo }}
        run: |
          docker run --rm -e GITHUB_ACTIONS -e GITHUB_STEP_SUMMARY -e CARGO_TERM_COLOR \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" \
            "$IMAGE" scripts/linux_wheel.sh "$PYTHON_VERSION" "$TARGET" "$COMPATIBILITY" "$PGO"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheel-${{ matrix.platform.name }}-${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  native:
    name: ${{ matrix.platform.name }} (${{ matrix.python }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: macos-arm64, runner: macos-15, pgo: true }
          - { name: macos-x86_64, runner: macos-15-intel, pgo: true }
          - { name: windows-x64, runner: windows-2025, pgo: true }
          - { name: windows-arm64, runner: windows-11-arm, pgo: true }
        python: ["3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv python install "$PYTHON_VERSION" 3.13
        env:
          PYTHON_VERSION: ${{ matrix.python }}
      # rustup on the runner installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - name: Release tools (hash-pinned maturin)
        run: |
          uv venv target/release-tools --python 3.13
          uv pip install --python target/release-tools --require-hashes -r scripts/release-requirements.txt
      - name: Build
        env:
          PYTHON_VERSION: ${{ matrix.python }}
          PGO: ${{ matrix.platform.pgo }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then tools=target/release-tools/Scripts; else tools=target/release-tools/bin; fi
          if [ "$PGO" = true ]; then mode=--fallback-plain; else mode=--no-pgo; fi
          "$tools/python" scripts/pgo_wheel.py --python "$PYTHON_VERSION" "$mode" --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheel-${{ matrix.platform.name }}-${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: "1.15.0"
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  test:
    # Each wheel: a scan for private material, then a fresh venv with nothing but pytest: a
    # smoke render (sync, async, markdown:, the compat alias, every module importable with the
    # standard library only), Chameleon's upstream suite on chameleon_rs, and test_typing
    # (scripts/check_wheel.py).
    name: test ${{ matrix.platform.name }} (${{ matrix.python }})
    needs: [linux, native]
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: manylinux-x86_64, runner: ubuntu-24.04 }
          - { name: manylinux-aarch64, runner: ubuntu-24.04-arm }
          - { name: musllinux-x86_64, runner: ubuntu-24.04, image: "quay.io/pypa/musllinux_1_2_x86_64" }
          - { name: musllinux-aarch64, runner: ubuntu-24.04-arm, image: "quay.io/pypa/musllinux_1_2_aarch64" }
          - { name: macos-arm64, runner: macos-15 }
          - { name: macos-x86_64, runner: macos-15-intel }
          - { name: windows-x64, runner: windows-2025 }
          - { name: windows-arm64, runner: windows-11-arm }
        python: ["3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t"]
    defaults:
      run:
        shell: bash
    env:
      PYTHON_VERSION: ${{ matrix.python }}
    steps:
      # Chameleon's fixtures are compared byte for byte: no CRLF conversion on Windows.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wheel-${{ matrix.platform.name }}-${{ matrix.python }}
          path: dist
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        if: ${{ !matrix.platform.image }}
      - run: uv python install "$PYTHON_VERSION"
        if: ${{ !matrix.platform.image }}
      - name: Test
        if: ${{ !matrix.platform.image && runner.os != 'Windows' }}
        run: uv run --no-project --python "$PYTHON_VERSION" scripts/check_wheel.py dist/*.whl
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: uv run --no-project --python "$PYTHON_VERSION" scripts/check_wheel.py --smoke-only dist/*.whl
      - name: Upstream suite and test_typing (Windows)
        # Never run on Windows before the first release (CI covers Linux and macOS): reported,
        # not yet blocking. Make it blocking once it is green.
        if: runner.os == 'Windows'
        continue-on-error: true
        run: uv run --no-project --python "$PYTHON_VERSION" scripts/check_wheel.py --suites-only dist/*.whl
      - name: Test (musl, in the musllinux image)
        # JavaScript actions cannot run inside Alpine-based containers, so docker is run by
        # hand; the image has every CPython under /opt/python.
        if: ${{ matrix.platform.image }}
        env:
          IMAGE: ${{ matrix.platform.image }}
        run: |
          abi=$(echo "$PYTHON_VERSION" | sed -E 's/^3\.([0-9]+)(t?)$/cp3\1-cp3\1\2/')
          docker run --rm -e GITHUB_ACTIONS -v "$PWD:$PWD" -w "$PWD" "$IMAGE" \
            "/opt/python/$abi/bin/python" scripts/check_wheel.py --python "/opt/python/$abi/bin/python" dist/*.whl

  test-sdist:
    # The sdist alone builds a working wheel (no file it needs is left out of it), with the
    # toolchain its rust-toolchain.toml pins.
    needs: [sdist]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sdist
          path: dist
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv python install 3.15
      - run: uv run --no-project --python 3.15 scripts/check_wheel.py --python 3.15 dist/*.tar.gz

  publish:
    name: publish to PyPI
    needs: [linux, native, sdist, test, test-sdist]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Trusted publishing: configure the `pypi` environment (Settings > Environments, ideally
    # with required reviewers) and the trusted publisher on PyPI for this repository and
    # workflow file. No token is stored anywhere.
    environment:
      name: pypi
      url: https://pypi.org/project/chameleon-rs/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sdist
          path: dist
      - name: Check the artifact set
        run: |
          ls -l dist
          wheels=$(find dist -name '*.whl' | wc -l)
          sdists=$(find dist -name '*.tar.gz' | wc -l)
          echo "wheels: $wheels, sdists: $sdists"
          # 4 Linux + 4 macOS/Windows platforms, 6 interpreters each, and one sdist.
          test "$wheels" -eq 48 && test "$sdists" -eq 1
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
