name: Release

# Builds the release artifacts, tests every wheel, and (only when asked) publishes to PyPI.
# Run it by hand: Actions > Release > Run workflow. With `publish` unchecked it is a dry run
# that builds and tests everything and keeps the artifacts on the run. The version is whatever
# Cargo.toml says: bump it (and CHANGELOG.md) before running with `publish`.
#
# Wheels: CPython 3.12-3.15 and free-threaded 3.14t/3.15t, for Linux (manylinux_2_28 and
# musllinux_1_2, x86_64 and aarch64), macOS (arm64, x86_64) and Windows (x64, arm64), plus the
# sdist. Every wheel is profile-guided (scripts/pgo_wheel.py, the steps of `make build-pgo`),
# trained per interpreter on a native runner of its architecture, except Windows arm64 (see
# its matrix entry). Linux wheels are built in the PyPA manylinux/musllinux images by
# maturin-action: the training runs in the same container (before-script-linux), and the
# action's build reads the merged profile through RUSTFLAGS.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to PyPI (trusted publishing, environment `pypi`) after every test passes"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PYTHONUTF8: "1"

jobs:
  linux:
    name: ${{ matrix.platform.libc }} ${{ matrix.platform.arch }} (${{ matrix.python }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { libc: manylinux, arch: x86_64, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, manylinux: "2_28", image: "quay.io/pypa/manylinux_2_28_x86_64" }
          - { libc: manylinux, arch: aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, manylinux: "2_28", image: "quay.io/pypa/manylinux_2_28_aarch64" }
          - { libc: musllinux, arch: x86_64, runner: ubuntu-24.04, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2, image: "quay.io/pypa/musllinux_1_2_x86_64" }
          - { libc: musllinux, arch: aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2, image: "quay.io/pypa/musllinux_1_2_aarch64" }
        python: ["3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t"]
    steps:
      - uses: actions/checkout@v5
      # The PyPA images run natively on a runner of the same architecture, with every CPython
      # under /opt/python (maturin-action puts them on PATH), so the instrumented build can be
      # trained there. The workspace is mounted at the same path in the container.
      - uses: PyO3/maturin-action@v1
        env:
          RUSTFLAGS: -Cprofile-use=${{ github.workspace }}/target/pgo/merged.profdata
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          container: ${{ matrix.platform.image }}
          before-script-linux: >-
            python${{ matrix.python }} scripts/pgo_wheel.py --python python${{ matrix.python }}
            --maturin maturin --profile-only --profdata-out target/pgo/merged.profdata
          args: --release --out dist -i python${{ matrix.python }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform.libc }}-${{ matrix.platform.arch }}-${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  native:
    name: ${{ matrix.platform.name }} (${{ matrix.python }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: macos-arm64, runner: macos-15, pgo: true }
          - { name: macos-x86_64, runner: macos-15-intel, pgo: true }
          - { name: windows-x64, runner: windows-2025, pgo: true }
          # Not profile-guided: rustc's profiler runtime for aarch64-pc-windows-msvc has not
          # been tried here. Set `pgo: true` once a run shows `-Cprofile-generate` links.
          - { name: windows-arm64, runner: windows-11-arm, pgo: false }
        python: ["3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv python install ${{ matrix.python }}
      - run: uv tool install "maturin>=1.15,<2"
      # rustup on the runner installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup show active-toolchain
      - name: Build (profile-guided)
        if: matrix.platform.pgo
        run: uv run --no-project --python ${{ matrix.python }} scripts/pgo_wheel.py --python ${{ matrix.python }} --maturin maturin --out dist
      - name: Build
        if: ${{ !matrix.platform.pgo }}
        run: maturin build --release --out dist -i "$(uv python find ${{ matrix.python }})"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform.name }}-${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  test:
    # Each wheel in a fresh venv with nothing but pytest: a smoke render (sync, async,
    # markdown:, the compat alias, every module importable with the standard library only),
    # Chameleon's upstream suite on chameleon_rs, and test_typing (scripts/check_wheel.py).
    name: test ${{ matrix.platform.name }} (${{ matrix.python }})
    needs: [linux, native]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: manylinux-x86_64, runner: ubuntu-24.04, artifact: manylinux-x86_64 }
          - { name: manylinux-aarch64, runner: ubuntu-24.04-arm, artifact: manylinux-aarch64 }
          - { name: musllinux-x86_64, runner: ubuntu-24.04, artifact: musllinux-x86_64, image: "quay.io/pypa/musllinux_1_2_x86_64" }
          - { name: musllinux-aarch64, runner: ubuntu-24.04-arm, artifact: musllinux-aarch64, image: "quay.io/pypa/musllinux_1_2_aarch64" }
          - { name: macos-arm64, runner: macos-15, artifact: macos-arm64 }
          - { name: macos-x86_64, runner: macos-15-intel, artifact: macos-x86_64 }
          - { name: windows-x64, runner: windows-2025, artifact: windows-x64 }
          - { name: windows-arm64, runner: windows-11-arm, artifact: windows-arm64 }
        python: ["3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t"]
    defaults:
      run:
        shell: bash
    steps:
      # Chameleon's fixtures are compared byte for byte: no CRLF conversion on Windows.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.platform.artifact }}-${{ matrix.python }}
          path: dist
      - uses: astral-sh/setup-uv@v6
        if: ${{ !matrix.platform.image }}
      - run: uv python install ${{ matrix.python }}
        if: ${{ !matrix.platform.image }}
      - name: Test (Windows, smoke only)
        if: runner.os == 'Windows'
        run: uv run --no-project --python ${{ matrix.python }} scripts/check_wheel.py --smoke-only dist/*.whl
      - name: Test
        if: ${{ !matrix.platform.image && runner.os != 'Windows' }}
        run: uv run --no-project --python ${{ matrix.python }} scripts/check_wheel.py dist/*.whl
      - name: Test (upstream suite, Windows)
        # Never run on Windows before the first release (CI covers Linux and macOS): reported,
        # not yet blocking. Make it blocking once it is green.
        if: runner.os == 'Windows'
        continue-on-error: true
        run: uv run --no-project --python ${{ matrix.python }} scripts/check_wheel.py dist/*.whl
      - name: Test (musl, in the musllinux image)
        # JavaScript actions cannot run inside Alpine-based containers, so docker is run by
        # hand; the image has every CPython under /opt/python.
        if: ${{ matrix.platform.image }}
        run: |
          tag=$(echo "${{ matrix.python }}" | sed -E 's/^3\.([0-9]+)(t?)$/cp3\1-cp3\1\2/')
          docker run --rm -v "$PWD:$PWD" -w "$PWD" ${{ matrix.platform.image }} \
            "/opt/python/$tag/bin/python" scripts/check_wheel.py --python "/opt/python/$tag/bin/python" dist/*.whl

  test-sdist:
    # The sdist alone builds a working wheel (no file it needs is left out of it).
    needs: [sdist]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.15
      - run: uv run --no-project --python 3.15 scripts/check_wheel.py --python 3.15 dist/*.tar.gz

  publish:
    name: publish to PyPI
    needs: [linux, native, sdist, test, test-sdist]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    # Trusted publishing: configure the `pypi` environment (Settings > Environments, ideally
    # with required reviewers) and the trusted publisher on PyPI for this repository and
    # workflow file. No token is stored anywhere.
    environment:
      name: pypi
      url: https://pypi.org/project/chameleon-rs/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Check the artifact set
        run: |
          ls -l dist
          wheels=$(find dist -name '*.whl' | wc -l)
          sdists=$(find dist -name '*.tar.gz' | wc -l)
          echo "wheels: $wheels, sdists: $sdists"
          # 4 Linux + 4 macOS/Windows platforms, 6 interpreters each, and one sdist.
          test "$wheels" -eq 48 && test "$sdists" -eq 1
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
