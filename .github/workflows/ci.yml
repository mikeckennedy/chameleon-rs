name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: CI only checks out and tests. Actions are pinned by commit (tag in the comment).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13", "3.14", "3.15", "3.14t"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      # rustup on the runner installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup show active-toolchain
      - run: uv venv venv --python ${{ matrix.python }}
      - run: make dev
      # `make test` includes the upstream suite on both engines (`test-upstream-rust`: the
      # compatibility score, a strict ratchet).
      - run: make test

  integration:
    # Level 4: fastapi-chameleon, chameleon-flask, chameleon-robyn and chameleon_partials,
    # unmodified, on chameleon-rs through the compat alias (Python 3.14: robyn's wheels).
    name: integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: rustup show active-toolchain
      - run: uv venv venv --python 3.15
      - run: make dev
      - run: make test-integration

  pgo:
    # The profile-guided release build (Phase 10: about 10% faster renders), built and tested
    # as the release wheels will be (Phase 12).
    name: pgo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: rustup show active-toolchain
      - run: uv venv venv --python 3.15
      - run: make dev
      - run: make build-pgo
      - run: venv/bin/python -m pytest -q
      - run: CHAMELEON_ENGINE=rust venv/bin/python -m pytest -q tests/upstream

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-deny
      - run: uv venv venv --python 3.15
      - run: make dev
      - run: PATH="$PWD/venv/bin:$PATH" make lint

  docs:
    # Builds the docs site (docs/docs-site-plan.md) and runs its executable examples against
    # the extension; publishing stays manual (commit site/, the server serves it).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: 1.9.38
      - run: uv venv venv --python 3.15
      - run: make dev
      - run: make docs

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv venv venv --python 3.12
      - run: rustup toolchain install 1.90 --profile minimal
      - run: cargo +1.90 check --workspace
