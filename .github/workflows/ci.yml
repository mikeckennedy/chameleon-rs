name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13", "3.14", "3.15", "3.14t"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      # rustup on the runner installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup show active-toolchain
      - run: uv venv venv --python ${{ matrix.python }}
      - run: make dev
      # `make test` includes the upstream suite on both engines (`test-upstream-rust`: the
      # compatibility score, a strict ratchet).
      - run: make test

  integration:
    # Level 4: fastapi-chameleon, chameleon-flask, chameleon-robyn and chameleon_partials,
    # unmodified, on chameleon-rs through the compat alias (Python 3.14: robyn's wheels).
    name: integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: rustup show active-toolchain
      - run: uv venv venv --python 3.15
      - run: make dev
      - run: make test-integration

  pgo:
    # The profile-guided release build (Phase 10: about 10% faster renders), built and tested
    # as the release wheels will be (Phase 12).
    name: pgo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: rustup show active-toolchain
      - run: uv venv venv --python 3.15
      - run: make dev
      - run: make build-pgo
      - run: venv/bin/python -m pytest -q
      - run: CHAMELEON_ENGINE=rust venv/bin/python -m pytest -q tests/upstream

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: uv venv venv --python 3.15
      - run: make dev
      - run: PATH="$PWD/venv/bin:$PATH" make lint

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv venv venv --python 3.12
      - run: rustup toolchain install 1.90 --profile minimal
      - run: cargo +1.90 check --workspace
