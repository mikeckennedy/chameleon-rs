[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "chameleon-rs"
description = "A Rust implementation of the Chameleon page template engine, compatible with Chameleon's syntax and API."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
# Chameleon's license (BSD-like, the Repoze license, with ZPL, BSD and PSF portions): no SPDX id
# covers it, hence a LicenseRef. No `License ::` classifier: PEP 639 forbids them next to a
# license expression.
license = "LicenseRef-Chameleon"
license-files = ["LICENSE.txt", "COPYRIGHT.txt"]
authors = [{ name = "Michael Kennedy", email = "michael@talkpython.fm" }]
keywords = [
    "chameleon", "template", "templates", "page templates", "zpt", "tal", "metal", "html",
    "rust", "flask", "quart", "fastapi", "starlette", "robyn", "litestar",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Framework :: Flask",
    "Framework :: Litestar",
    "Framework :: Litestar :: 2",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    # Tested on 3.14t and 3.15t (the suite, a thread stress suite), not yet run in production.
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Text Processing :: Markup :: XML",
    "Typing :: Typed",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://mkennedy.codes/docs/chameleon-rs/"
Documentation = "https://mkennedy.codes/docs/chameleon-rs/"
Changelog = "https://github.com/mikeckennedy/chameleon-rust/blob/main/CHANGELOG.md"
Source = "https://github.com/mikeckennedy/chameleon-rust"
Issues = "https://github.com/mikeckennedy/chameleon-rust/issues"
Funding = "https://github.com/sponsors/mikeckennedy"

[dependency-groups]
# What the compatibility, differential and benchmark code needs. The reference Chameleon and
# chameleon_partials are installed editable from pinned clones in temp/ by `make dev`.
dev = ["maturin>=1.15,<2", "pytest>=9", "hypothesis>=6", "pydantic>=2", "setuptools", "ruff", "flask[async]>=3", "quart>=0.20", "fastapi>=0.115", "httpx", "mistune>=3", "litestar>=2.25,<3", "ty==0.0.90"]
# The docs site (`make docs`). Quarto is installed separately and must be on PATH.
docs = ["great-docs==0.13.0", "ipykernel"]

[tool.maturin]
manifest-path = "crates/chameleon-py/Cargo.toml"
python-source = "python"
module-name = "chameleon_rs._native"
# The Markdown spec examples are test data (the CommonMark spec is CC BY-SA 4.0): not shipped.
# The pinned toolchain goes into the sdist, so a build from it uses the compiler the wheels and
# the tests use (rustup reads it; a plain cargo ignores it and needs Rust 1.90 or later).
include = [{ path = "rust-toolchain.toml", format = "sdist" }]
exclude = [
    { path = "crates/chameleon-core/tests/markdown_spec/**/*", format = "sdist" },
    { path = "crates/chameleon-core/tests/markdown_spec.rs", format = "sdist" },
]
# No `pyo3/extension-module` feature: it is deprecated in PyO3 0.30, and maturin sets
# PYO3_BUILD_EXTENSION_MODULE itself. Plain `cargo test` keeps linking libpython.

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-p no:cacheprovider"

# ty is the type checker for this project; `make lint` runs it (zero diagnostics expected).
[tool.ty.environment]
# The oldest Python we support (requires-python), so newer stdlib APIs are flagged.
python-version = "3.12"
# python/ is the package; tests/python and tests/upstream hold the helper modules the tests import
# (exprtest, chameleon_tests). Not ".", or temp/chameleon would shadow the installed chameleon.
root = ["python", "tests/python", "tests/upstream", "tests/integration", "bench", "scripts"]
# chameleon_partials is an editable install through an import hook, which ty can't follow.
# temp/robyn-typing: Robyn's sources (`make dev`), as Robyn has no wheel for every Python we
# lint on (3.15).
extra-paths = ["temp/chameleon_partials", "temp/robyn-typing"]
# Resolve third-party packages from venv/ rather than from an activated VIRTUAL_ENV. ty picks
# site-packages from the environment, not from the location of its own binary, so without this
# a non-activated shell (CI, a subprocess, an editor task) silently resolves Homebrew's
# site-packages instead and reports phantom unresolved-import errors.
python = "venv"

[tool.ty.src]
include = ["python", "tests/python", "tests/upstream/conftest.py", "tests/integration", "bench", "scripts"]
exclude = [
    "**/.*",
    "**/__pycache__/**",
    # Never ours to check: the reference clones, environments, build output, the docs site.
    "temp/**",
    "venv/**",
    "target/**",
    ".claude/**",
    "site/**",
    "great-docs/**",
    # Chameleon's own test suite, vendored unmodified.
    "tests/upstream/chameleon_tests/**",
    # Vendored verbatim from Chameleon (D7): kept as upstream wrote them.
    "python/chameleon_rs/astutil.py",
    "python/chameleon_rs/codegen.py",
    "python/chameleon_rs/metal.py",
    "python/chameleon_rs/namespaces.py",
    "python/chameleon_rs/types.py",
]

[tool.ty.analysis]
# Optional at runtime and never installed in venv: zope.i18n (i18n.py adapts it when present)
# and freezegun (realsite.py, run from the real application's venv).
allowed-unresolved-imports = ["zope.**", "freezegun"]

[tool.ruff]
line-length = 120
# Vendored verbatim from Chameleon (D7): kept as upstream wrote them.
extend-exclude = [
    "tests/upstream/chameleon_tests",
    "temp",
    "python/chameleon_rs/astutil.py",
    "python/chameleon_rs/codegen.py",
    "python/chameleon_rs/metal.py",
    "python/chameleon_rs/namespaces.py",
    "python/chameleon_rs/types.py",
]

[tool.ruff.format]
quote-style = "single"
